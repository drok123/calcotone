name: CALCOTONE Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: calcotone-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: RANDOM structural diagnostic
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('src/randomTransferBridge.ts', 'utf8');
          for (const needle of [
            'beginViewportPerformanceHold()',
            'engine.setEffectBypassed(entry.id, entry.bypassed)',
            '.finally(() => {',
            'import.meta.hot.dispose',
            "document.removeEventListener('click', onRandomizerClick, true)",
          ]) {
            if (!source.includes(needle)) throw new Error(`Missing RANDOM structural marker: ${needle}`);
          }
          EOF

      - name: Structural audit (baseline diagnostic)
        continue-on-error: true
        run: npm run audit

      - name: Visual audit
        run: npm run audit:visual

      - name: Runtime audit
        run: npm run audit:runtime

      - name: Dropdown audit
        run: npm run audit:dropdowns

      - name: Routing audit
        run: npm run audit:routing

      - name: Signal audit (baseline diagnostic)
        continue-on-error: true
        run: npm run audit:signal

      - name: Dream audit
        run: npm run audit:dream

      - name: Video-world audit
        run: npm run audit:video-world

      - name: Lint
        run: npm run lint

      - name: TypeScript RANDOM diagnostic
        run: |
          npx tsc -b --pretty false > /tmp/tsc.log 2>&1 || true
          if grep -q 'randomTransferBridge.ts' /tmp/tsc.log; then
            echo 'TypeScript reported an error in randomTransferBridge.ts'
            exit 1
          fi

      - name: TypeScript build
        run: npx tsc -b

      - name: Vite build
        run: npx vite build
