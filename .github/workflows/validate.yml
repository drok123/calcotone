name: CALCOTONE Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: calcotone-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Structural audit
        run: npm run audit

      - name: Visual audit
        run: npm run audit:visual

      - name: Runtime audit
        run: npm run audit:runtime

      - name: Dropdown audit
        run: npm run audit:dropdowns

      - name: Routing audit
        run: npm run audit:routing

      - name: Signal audit
        run: npm run audit:signal

      - name: Dream audit
        run: npm run audit:dream

      - name: Video-world audit
        run: npm run audit:video-world

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
