name: Faceplate v2 single coordinate space

on:
  push:
    branches: [faceplate-v2-single-space]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faceplate-v2-single-space
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v2 migration
        run: python scripts/faceplate_v2_single_space.py
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        run: npm run build
      - name: Commit verified source only
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/faceplateLayout.ts src/components/effects/EffectModule.tsx
          git commit -m "Use one coordinate space for faceplate editing"
          git push origin faceplate-v2-single-space
