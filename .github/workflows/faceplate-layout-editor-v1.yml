name: Faceplate layout editor v1

on:
  push:
    branches: [faceplate-layout-editor-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faceplate-layout-editor-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply faceplate editor integration
        run: python scripts/apply_faceplate_editor_v1.py
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        id: build
        continue-on-error: true
        run: npm run build > faceplate-editor-build.log 2>&1
      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: faceplate-editor-build-log
          path: faceplate-editor-build.log
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          cat faceplate-editor-build.log
          exit 1
      - name: Commit verified source
        if: github.event_name == 'push' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/effects/EffectModule.tsx src/components/motion/UiPolish.css
          git commit -m "Wire faceplate layout editor into the rack"
          git push origin faceplate-layout-editor-v1
