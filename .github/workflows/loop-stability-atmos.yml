name: Loop stability and Atmos depth

on:
  push:
    branches:
      - agent/native-dsp-core

permissions:
  contents: write

jobs:
  patch-check-land:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Loop and Atmos pass
        run: python scripts/loop-stability-atmos-patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused Loop and Atmos checks
        run: |
          npm run audit:loop
          npm run audit:native
          npm run build

      - name: Run full Calcotone diagnostics
        run: npm run check

      - name: Commit validated source
        run: |
          rm -f scripts/loop-stability-atmos-patch.py .github/workflows/loop-stability-atmos.yml
          git config user.name "drok123"
          git config user.email "52803485+drok123@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Stabilize Loop and deepen Atmos"
          git push origin HEAD:agent/native-dsp-core
