name: Fix random dropdown sync and Rail C artwork

on:
  push:
    branches: [agent/native-dsp-core]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply random/UI/artwork patch
        run: node scripts/apply-random-dropdown-art-patch.mjs
      - name: Validate dropdown contract and production build
        run: |
          npm run audit:dropdowns
          npm run build
      - name: Commit patch and remove temporary machinery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-random-dropdown-art.yml scripts/apply-random-dropdown-art-patch.mjs
          git add src/App.tsx src/components/effects/RailCModules.tsx src/components/signal/pressureStore.ts src/components/ascii/RailCHardwareDisplay.tsx scripts/dropdown-audit.mjs
          git commit -m "Sync random dropdowns and unify Rail C artwork"
          git push origin HEAD:agent/native-dsp-core
