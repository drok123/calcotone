name: Apply global power rocker

on:
  push:
    branches:
      - agent/native-dsp-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply rocker patch
        run: node scripts/apply-global-power-rocker.mjs
      - name: Validate focused UI contract
        run: |
          node scripts/visual-audit.mjs
          npx tsc -b
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-global-power-rocker.mjs .github/workflows/apply-global-power-rocker.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Move CALCOTONE power to header rocker"
          git push origin HEAD:agent/native-dsp-core
