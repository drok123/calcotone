name: Windows Native Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "native/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/windows-native-release.yml"

permissions:
  contents: read

concurrency:
  group: windows-native-release-main
  cancel-in-progress: false

jobs:
  build-windows-native:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Audit canonical desktop source
        run: |
          npm run audit:core-contract
          npm run audit:artifact-matrix
          npm run audit:windows-ui-parity
          npm run audit:latency

      - name: Build production faceplate
        run: npm run build

      - name: Generate native spectrum host sources
        shell: pwsh
        run: |
          python native/tools/apply_native_host_visual_parity.py native/src/wasapi_host.cpp native/src/wasapi_host.parity.cpp
          Move-Item -Force native/src/wasapi_host.parity.cpp native/src/wasapi_host.cpp
          python native/tools/apply_control_server_spectrum.py native/src/control_server.cpp native/src/control_server.parity.cpp
          Move-Item -Force native/src/control_server.parity.cpp native/src/control_server.cpp
          Select-String -Path native/src/wasapi_host.cpp -Pattern 'visual_spectrum.publish' -Quiet | ForEach-Object { if (-not $_) { throw 'Native spectrum publish path missing.' } }
          Select-String -Path native/src/control_server.cpp -Pattern 'GET /spectrum' -Quiet | ForEach-Object { if (-not $_) { throw 'Native spectrum route missing.' } }
          Select-String -Path src/App.tsx -Pattern 'new NativeVisualSpectrum' -Quiet | ForEach-Object { if (-not $_) { throw 'Native spectrum UI source missing.' } }
          Select-String -Path src/App.tsx -Pattern "DEFAULT_RAIL_C_ORDER = \['stomp', 'chaos', 'pressure'\]" -Quiet | ForEach-Object { if (-not $_) { throw 'Stack Rail C placement missing.' } }
          Select-String -Path src/App.tsx,src/components/effects/RailCModules.tsx -Pattern 'SynthModule|onSynth|moduleId === ''synth''|SYNTH_MACHINES' -Quiet | ForEach-Object { if ($_) { throw 'Retired Synth code exists in canonical source.' } }
          Select-String -Path src/App.tsx,src/components/effects/RailCModules.tsx -Pattern 'motionPadProps|<MotionPad' -Quiet | ForEach-Object { if ($_) { throw 'Removed Stack XY input panel exists in canonical source.' } }
          Select-String -Path src/App.tsx -Pattern 'commandLine\(`param \$\{moduleId\} \$\{parameterId\}' -Quiet | ForEach-Object { if (-not $_) { throw 'Native XY parameter routing missing.' } }
          Select-String -Path native/START-CALCOTONE-NATIVE.bat -Pattern 'CALCOTONE_AUDIO_MODE=exclusive' -Quiet | ForEach-Object { if (-not $_) { throw 'Exclusive-mode launcher default missing.' } }

      - name: Restore WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory native/packages -NonInteractive
          $package = Get-ChildItem native/packages -Directory -Filter 'Microsoft.Web.WebView2.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'WebView2 NuGet package was not restored.' }
          "CALCOTONE_WEBVIEW2_ROOT=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure native host
        run: >-
          cmake -S native -B native/build -A x64
          -DCALCOTONE_WEBVIEW2_ROOT="${{ env.CALCOTONE_WEBVIEW2_ROOT }}"

      - name: Build native host
        run: cmake --build native/build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Assemble standalone package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD 'artifact/CALCOTONE-Windows-Native'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot 'web') | Out-Null

          Copy-Item 'native/build/Release/calcotone_host.exe' $packageRoot
          Copy-Item 'dist/*' (Join-Path $packageRoot 'web') -Recurse -Force
          Copy-Item 'native/*.bat' $packageRoot -Force
          Copy-Item 'native/README.md' (Join-Path $packageRoot 'NATIVE-README.md') -Force
          Copy-Item 'contracts/calcotone-core-manifest.json' (Join-Path $packageRoot 'CALCOTONE-CONTRACT.json') -Force

          @"
          CALCOTONE Windows Native
          ========================

          1. Extract the entire ZIP.
          2. Double-click START-CALCOTONE-NATIVE.bat.
          3. Keep the web folder beside calcotone_host.exe.
          4. Use LIST-CALCOTONE-DEVICES.bat and CALCOTONE-AUDIO-CONFIG.bat when changing interfaces or channels.

          Build commit: $env:GITHUB_SHA
          "@ | Set-Content (Join-Path $packageRoot 'INSTALL.txt')

          $manifest = [ordered]@{
            product = 'CALCOTONE Windows Native'
            commit = $env:GITHUB_SHA
            workflowRun = $env:GITHUB_RUN_ID
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            source = 'Canonical checked-in React and C++ source; no release-time UI mutation'
            frontend = 'TypeScript + Vite production build passed'
            native = 'CMake Release build passed against generated core contract'
            tests = 'Core contract, CTest, UI parity, and latency audits passed'
            parityModules = @('Ember', 'Drift', 'Halo', 'Atmos', 'Grain', 'Artifact', 'Stomp', 'Stack', 'Pressure')
            uiParity = [ordered]@{
              nativeSpectrum = 'post-rack FFT endpoint active'
              stack = 'amp readout only; embedded XY input panel removed'
              xy = 'global core-module modulation routed to native DSP'
              retiredSynth = 'absent from canonical source'
              launcher = 'exclusive WASAPI requested by default with safe fallback'
              controls = 'native command/state synchronization audited'
              artifact = 'single Format dropdown'
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $packageRoot 'BUILD-MANIFEST.json')

          Compress-Archive -Path $packageRoot -DestinationPath 'artifact/CALCOTONE-Windows-Native.zip' -Force
          Get-FileHash 'artifact/CALCOTONE-Windows-Native.zip' -Algorithm SHA256 |
            Select-Object Algorithm, Hash, Path |
            ConvertTo-Json | Set-Content 'artifact/CALCOTONE-Windows-Native.sha256.json'

      - name: Upload standalone ZIP
        uses: actions/upload-artifact@v7
        with:
          name: CALCOTONE-Windows-Native
          path: |
            artifact/CALCOTONE-Windows-Native.zip
            artifact/CALCOTONE-Windows-Native.sha256.json
          if-no-files-found: error
          retention-days: 90
