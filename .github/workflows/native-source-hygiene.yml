name: Native source hygiene validation

on:
  push:
    branches: [agent/native-dsp-reconcile]

permissions:
  contents: write

jobs:
  clean-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove tracked native build products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tracked_before="$(git ls-files 'native/build-portable/**' | wc -l | tr -d ' ')"
          echo "Tracked native/build-portable files before cleanup: $tracked_before"
          test "$tracked_before" -gt 0

          if ! grep -qxF 'native/build-portable/' .gitignore; then
            printf '\nnative/build-portable/\n' >> .gitignore
          fi

          git rm -r --ignore-unmatch native/build-portable
          git rm --ignore-unmatch .github/workflows/native-source-hygiene.yml
          git add .gitignore

          test -z "$(git ls-files 'native/build-portable/**')"
          git diff --cached --check

      - name: Rebuild and run complete Calcotone validation
        run: npm run check
      - name: Verify build products stay untracked
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files 'native/build-portable/**')"
          if git status --porcelain --untracked-files=all | grep -E '^\?\? native/build-portable/'; then
            echo 'native/build-portable outputs are not being ignored'
            exit 1
          fi
      - name: Commit source-only native tree
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Remove tracked native build products"
          git push origin HEAD:agent/native-dsp-reconcile
