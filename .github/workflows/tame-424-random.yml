name: Tame 424 random sweet spots

on:
  push:
    branches: [tame-424-random]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tame-424-random
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply 424 random tuning
        run: python scripts/tame_424_random.py
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        run: npm run build
      - name: Commit verified App source only
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Tame TASCAM 424 random sweet spots"
          git push origin tame-424-random
