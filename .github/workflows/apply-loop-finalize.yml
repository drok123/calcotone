name: Apply Loop integration

on:
  push:
    branches:
      - agent/native-dsp-core

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch-script anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-loop-finalize.mjs')
          s=p.read_text()
          old="source = replaceSlice(source, `  useEffect(() => {\\n    const syncNativePressure`, `  const [recordingState`, `${loopSync}  const [recordingState`, 'native Pressure sync effect');"
          new="source = replaceSlice(source, `  useEffect(() => {\\n    const syncNativePressure`, `  const [recordingState`, loopSync, 'native Pressure sync effect');"
          if old not in s:
              raise SystemExit('Loop App replacement boundary not found')
          s=s.replace(old,new,1)
          start=s.index('// ---------------- Native host commands / health ----------------')
          end=s.index('// ---------------- Native build registration ----------------', start)
          block=s[start:end]
          block=block.replace('\\\\"','\\"')
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          node --check scripts/apply-loop-finalize.mjs
      - name: Apply Loop integration
        run: node scripts/apply-loop-finalize.mjs
      - name: Refresh native contract test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/tests/core_contract_test.cpp')
          s=p.read_text()
          replacements={
            'artifact->model_count != 14':'artifact->model_count != 18',
            'pressure->name != "Pressure" || pressure->rail != \'C\' || pressure->model_count != 4':'pressure->name != "Loop" || pressure->rail != \'C\' || pressure->model_count != 1',
            'kMediaModels.back() != "Neve BCM10"':'kMediaModels.back() != "compressor-vca"',
            'kPressureModels.front() != "fet" || kPressureModels.back() != "vca"':'kPressureModels.front() != "loop" || kPressureModels.back() != "loop"',
            'constexpr std::array<std::string_view, 5> pressure_control_ids{\n      "style", "drive", "time", "character", "mix"};\n  constexpr std::array<float, 5> pressure_defaults{2.F,.42F,.46F,.38F,.72F};':'constexpr std::array<std::string_view, 4> pressure_control_ids{\n      "track", "masterLevel", "overdub", "fade"};\n  constexpr std::array<float, 4> pressure_defaults{0.F,.78F,1.F,.18F};'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'contract test anchor missing: {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Install web dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate Loop and web build
        run: |
          node scripts/loop-audit.mjs
          node scripts/visual-audit.mjs
          npm run build
      - name: Build and test native DSP
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release -j2
          ctest --test-dir native/build --output-on-failure
      - name: Commit integrated Loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-loop-finalize.mjs .github/workflows/apply-loop-finalize.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finish eight-track Loop workstation"
          git push origin HEAD:agent/native-dsp-core
