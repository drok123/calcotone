name: Readable Loop circle UI

on:
  push:
    branches:
      - agent/native-dsp-core
    paths:
      - .github/workflows/loop-readable-circle.yml
      - scripts/apply-loop-readable-circle.py

permissions:
  contents: write

jobs:
  patch-check-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply readable Loop display
        run: python scripts/apply-loop-readable-circle.py
      - name: Install dependencies
        run: npm ci
      - name: Run Loop audit
        run: npm run audit:loop
      - name: Run production build
        run: npm run build
      - name: Run full Calcotone diagnostics
        run: npm run check
      - name: Commit validated display
        shell: bash
        run: |
          rm -f .github/workflows/loop-readable-circle.yml scripts/apply-loop-readable-circle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ascii/RailCHardwareDisplay.tsx scripts/loop-audit.mjs .github/workflows/loop-readable-circle.yml scripts/apply-loop-readable-circle.py
          git commit -m "Make Loop display instantly readable"
          git push origin HEAD:agent/native-dsp-core
