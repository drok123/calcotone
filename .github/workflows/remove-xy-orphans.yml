name: Validate XY retirement

on:
  push:
    branches: [remove-xy-clean]

permissions:
  contents: write

jobs:
  validate-xy-retirement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remove-xy-clean
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove XY orphans and migrate audits
        run: node scripts/clean-xy-orphans.mjs
      - name: Run full Calcotone diagnostics and production build
        run: npm run check
      - name: Commit validated retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Retire XY audit contracts and orphan styles"
            git push origin HEAD:remove-xy-clean
          fi
