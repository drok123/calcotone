name: Windows UI Recovery

on:
  workflow_dispatch:
  push:
    branches: [windows-recovery-1ccde1a]
    paths:
      - scripts/materialize-windows-ui-recovery.py
      - .github/workflows/windows-ui-recovery.yml

permissions:
  contents: write

concurrency:
  group: windows-ui-recovery
  cancel-in-progress: true

jobs:
  build-ui-recovery:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize paired web faceplate recovery
        run: python scripts/materialize-windows-ui-recovery.py

      - name: Verify UI recovery invariants
        shell: pwsh
        run: |
          $app = Get-Content src/App.tsx -Raw
          $css = Get-Content src/App.css -Raw
          $rail = Get-Content src/components/effects/RailCModules.css -Raw
          $effect = Get-Content src/components/effects/EffectModule.tsx -Raw
          $layout = Get-Content src/ui/faceplateLayout.ts -Raw

          if ($css -notmatch 'Native faceplate geometry contract') { throw 'Paired custom faceplate CSS is missing.' }
          if ($css -notmatch 'faceplate-knob-slot > \.knob-control \{\s*width: 68px;') { throw 'Core faceplate slot width is not compact.' }
          if ($css -notmatch '--control-diameter: 64px;') { throw '64px knob shell contract is missing.' }
          if ($css -notmatch '--control-face: 46px;') { throw '46px knob face contract is missing.' }
          if ($rail -notmatch 'rail-c-control-surface \.faceplate-knob-slot \{\s*width: 68px;') { throw 'Rail C control width is not compact.' }
          if ($effect -notmatch 'const customFaceplate = faceplateEditor\.layout\.custom;') { throw 'Shared faceplate ownership is missing.' }
          if ($layout -notmatch 'calcotone\.faceplate-layout\.windows-recovery\.v2') { throw 'Fresh compact recovery storage namespace is missing.' }
          if ($layout -match 'stageHeight: 320,|stageHeight: 292,') { throw 'Old clipping-prone stage remains.' }
          if ($layout -notmatch 'stageHeight: 304,') { throw 'Compact 304px recovery stage is missing.' }
          if ($layout -notmatch 'pressure: \{\s*viewportHeight: 168,\s*stageHeight: 304,') { throw 'Pressure compact geometry is missing.' }
          if ($layout -notmatch '\{ x: 0\.14, y: 240 \}') { throw 'Pressure control row is not restored.' }
          if ($app -notmatch 'SIGNAL RANDOM</button>\s*<span className="utility-button-divider"[^>]*\/>\s*<button[^>]*>EXPLAIN</button>\s*<FaceplateLayoutEditor \/>\s*<button[^>]*>DSP</button>') { throw 'EXPLAIN / LAYOUT / DSP are not grouped beside SIGNAL RANDOM.' }
          if ($app -notmatch 'HARDWARE_SWEET_SPOTS') { throw 'Hardware sweet-spot recipes are missing.' }
          if ($app -notmatch 'RANDOM_PROFILE_RECIPES') { throw 'Coordinated random profiles are missing.' }
          if ($app -notmatch 'scheduleLocalRandomReveal\(targets, activeRailC\);\s*return;') { throw 'Native random does not drive staged UI targets.' }
          if ($app -notmatch 'guardRandomParameter') { throw 'Random safety guards are missing.' }

      - name: Build production faceplate
        run: npm run build

      - name: Generate native spectrum host sources
        shell: pwsh
        run: |
          python native/tools/apply_native_host_visual_parity.py native/src/wasapi_host.cpp native/src/wasapi_host.parity.cpp
          Move-Item -Force native/src/wasapi_host.parity.cpp native/src/wasapi_host.cpp
          python native/tools/apply_control_server_spectrum.py native/src/control_server.cpp native/src/control_server.parity.cpp
          Move-Item -Force native/src/control_server.parity.cpp native/src/control_server.cpp

      - name: Restore WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory native/packages -NonInteractive
          $package = Get-ChildItem native/packages -Directory -Filter 'Microsoft.Web.WebView2.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'WebView2 NuGet package was not restored.' }
          "CALCOTONE_WEBVIEW2_ROOT=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure native host
        run: >-
          cmake -S native -B native/build -A x64
          -DCALCOTONE_WEBVIEW2_ROOT="${{ env.CALCOTONE_WEBVIEW2_ROOT }}"

      - name: Build native host
        run: cmake --build native/build --config Release --parallel

      - name: Run native tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Assemble isolated recovery package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD 'artifact/CALCOTONE-Windows-UI-Recovery'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot 'web') | Out-Null

          Copy-Item 'native/build/Release/calcotone_host.exe' $packageRoot
          Copy-Item 'dist/*' (Join-Path $packageRoot 'web') -Recurse -Force
          Copy-Item 'native/*.bat' $packageRoot -Force
          Copy-Item 'native/README.md' (Join-Path $packageRoot 'NATIVE-README.md') -Force

          @"
          CALCOTONE Windows UI Recovery
          =============================

          This is an isolated UI-validation build from windows-recovery-1ccde1a.
          It does not replace the current main build.

          1. Extract the entire ZIP into a new folder.
          2. Do not copy it over an older CALCOTONE folder.
          3. Double-click START-CALCOTONE-NATIVE.bat.
          4. Check the compact toolbar, knob size, labels, random knob updates, Rail C, Pressure, and fullscreen before testing DSP.

          Recovery source: $env:GITHUB_SHA
          "@ | Set-Content (Join-Path $packageRoot 'UI-RECOVERY-README.txt')

          $manifest = [ordered]@{
            product = 'CALCOTONE Windows UI Recovery'
            sourceBranch = 'windows-recovery-1ccde1a'
            workflowSource = $env:GITHUB_SHA
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            uiOnly = $true
            dspChanges = 'none'
            storageNamespace = 'calcotone.faceplate-layout.windows-recovery.v2'
            faceplate = [ordered]@{
              knobShell = 64
              controlSlot = 68
              viewportHeight = 168
              stageHeight = 304
              pressureControlY = 240
              staleLayoutMigration = 'disabled'
            }
            toolbar = 'Explain, Layout, and DSP grouped immediately after Signal Random'
            random = 'hardware sweet spots, guarded profiles, mutation, and staged native UI target reveal'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $packageRoot 'UI-RECOVERY-MANIFEST.json')

          Compress-Archive -Path $packageRoot -DestinationPath 'artifact/CALCOTONE-Windows-UI-Recovery.zip' -Force
          Get-FileHash 'artifact/CALCOTONE-Windows-UI-Recovery.zip' -Algorithm SHA256 |
            Select-Object Algorithm, Hash, Path |
            ConvertTo-Json | Set-Content 'artifact/CALCOTONE-Windows-UI-Recovery.sha256.json'

      - name: Upload UI recovery ZIP
        uses: actions/upload-artifact@v7
        with:
          name: CALCOTONE-Windows-UI-Recovery
          path: |
            artifact/CALCOTONE-Windows-UI-Recovery.zip
            artifact/CALCOTONE-Windows-UI-Recovery.sha256.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit canonical recovery source
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force native/packages -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force native/build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.css src/components/effects/EffectModule.tsx src/components/effects/RailCModules.css src/ui/faceplateLayout.ts
          if (-not (git diff --cached --quiet)) {
            git commit -m "Compact recovery toolbar and restore native random UI flow"
            git push origin HEAD:windows-recovery-1ccde1a
          }
