name: Signal rail behind modules

on:
  push:
    branches: [signal-rail-behind-modules]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signal-rail-behind-modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Put signal rail on the backplane
        run: |
          if ! grep -q "SIGNAL RAIL BACKPLANE" src/App.css; then
            cat >> src/App.css <<'EOF'

/* V8.4.31 — SIGNAL RAIL BACKPLANE
   The routing rail is scenery, never an interaction layer. Modules remain opaque
   above it so the line cannot bleed through a bypassed chassis or intercept edits. */
.rail-modules {
  position: relative;
  isolation: isolate;
}

.rail-modules::before {
  z-index: 0 !important;
  pointer-events: none !important;
}

.rail-modules > .effect-module {
  position: relative;
  z-index: 2 !important;
  opacity: 1;
}

.rail-modules > .effect-module:not(.enabled) {
  opacity: 1;
  filter: saturate(.55) brightness(.78);
}

.rail-modules > .effect-module.faceplate-layout-editing {
  z-index: 4 !important;
}
EOF
          fi
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        run: npm run build
      - name: Commit verified source
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- src/App.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.css
          git commit -m "Keep signal rails behind module chassis"
          git push origin signal-rail-behind-modules
