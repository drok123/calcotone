name: Fix Loop audits

on:
  push:
    branches: [agent/native-dsp-core]

permissions:
  contents: write

jobs:
  fix-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh Loop realtime audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/runtime-audit.mjs')
          s=p.read_text()
          old="requireText(railCRandom, \"RAIL_C_RANDOM_ORDER = ['stomp', 'chaos', 'pressure']\", 'Rail C RANDOM order');"
          new="requireText(railCRandom, \"RAIL_C_RANDOM_ORDER = ['stomp', 'chaos']\", 'Rail C RANDOM order excludes Loop');\nforbidText(railCRandom, \"'pressure'\", 'Loop must stay out of Rail C RANDOM registry');"
          if old not in s: raise SystemExit('Rail C RANDOM audit anchor missing')
          s=s.replace(old,new,1)
          old="requireText(railCModules, \"useRailCRandomController('pressure', state.enabled, randomizePressureProfile)\", 'Pressure profile-aware RANDOM controller');"
          new="forbidText(railCModules, \"useRailCRandomController('pressure'\", 'Loop must not register a RANDOM controller');"
          if old not in s: raise SystemExit('Pressure RANDOM controller audit anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Run full checks
        run: npm run check
      - name: Commit audit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-loop-audits.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align audits with standalone Loop"
          git push origin HEAD:agent/native-dsp-core
