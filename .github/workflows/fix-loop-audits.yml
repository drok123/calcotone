name: Fix Loop audits

on:
  push:
    branches: [agent/native-dsp-core]

permissions:
  contents: write

jobs:
  fix-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh Loop realtime and latency audits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('scripts/runtime-audit.mjs')
          s=p.read_text()
          replacements=[
            (
              "requireText(railCRandom, \"RAIL_C_RANDOM_ORDER = ['stomp', 'chaos', 'pressure']\", 'Rail C RANDOM order');",
              "requireText(railCRandom, \"RAIL_C_RANDOM_ORDER = ['stomp', 'chaos']\", 'Rail C RANDOM order excludes Loop');\nforbidText(railCRandom, \"'pressure'\", 'Loop must stay out of Rail C RANDOM registry');"
            ),
            (
              "requireText(railCModules, \"useRailCRandomController('pressure', state.enabled, randomizePressureProfile)\", 'Pressure profile-aware RANDOM controller');",
              "forbidText(railCModules, \"useRailCRandomController('pressure'\", 'Loop must not register a RANDOM controller');"
            ),
          ]
          for old,new in replacements:
            if old not in s: raise SystemExit(f'runtime audit anchor missing: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('scripts/latency-path-audit.mjs')
          s=p.read_text()
          replacements=[
            (
              "requireText(nativeProcessor, 'any_rack_active || !stack_off || pressure_active', 'Native true-RAW Dream isolation gate');",
              "requireText(nativeProcessor, 'any_rack_active || !stack_off', 'Native true-RAW Dream isolation gate');"
            ),
            (
              "requireText(nativeProcessor, 'pressure_one.process', 'Transport-independent post-STACK Pressure placement');",
              "forbidText(nativeProcessor, 'pressure_one.process', 'Retired post-STACK Pressure placement');\nrequireText(nativeProcessor, 'loop.process(output, frames)', 'Transport-independent post-rack Loop placement');"
            ),
            (
              "requireText(nativeProcessor, 'mix_dual_mono', 'Transport-independent final stereo mix');",
              "requireText(nativeProcessor, 'sum_dual_mono', 'Transport-independent post-rack stereo sum');\nrequireText(nativeProcessor, 'apply_output_safety', 'Transport-independent final output safety after Loop');"
            ),
            (
              "requireText(app, 'param pressure style', 'Native Pressure synchronization');",
              "requireText(app, 'loopParam masterLevel', 'Native Loop level synchronization');\nrequireText(app, 'loopTrackLevel', 'Native Loop per-track synchronization');"
            ),
          ]
          for old,new in replacements:
            if old not in s: raise SystemExit(f'latency audit anchor missing: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Run full checks
        run: npm run check
      - name: Commit audit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-loop-audits.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align audits with standalone Loop"
          git push origin HEAD:agent/native-dsp-core
