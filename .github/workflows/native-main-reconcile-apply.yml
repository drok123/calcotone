name: Apply native main reconciliation

on:
  push:
    branches: [agent/native-dsp-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Merge main with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            actual="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' \
              'circuits/modules/static-hardware-stage-template.cir' \
              'scripts/ascii-landscape-audit.mjs' \
              'scripts/visual-audit.mjs' \
              'src/App.tsx' \
              'src/components/controls/Knob.tsx' \
              'src/components/effects/EffectModule.tsx' \
              'src/components/effects/RailCModules.tsx' \
              'src/components/layout/CharcoalHardwarePass.css' | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected merge conflict set"
              echo "EXPECTED:"
              printf '%s\n' "$expected"
              echo "ACTUAL:"
              printf '%s\n' "$actual"
              exit 1
            fi

            git checkout --theirs circuits/modules/static-hardware-stage-template.cir
            git checkout --ours \
              scripts/ascii-landscape-audit.mjs \
              scripts/visual-audit.mjs \
              src/App.tsx \
              src/components/controls/Knob.tsx \
              src/components/effects/EffectModule.tsx \
              src/components/effects/RailCModules.tsx \
              src/components/layout/CharcoalHardwarePass.css
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import postcss from 'postcss';

          function replaceRequired(source, search, replacement, label) {
            if (!source.includes(search)) throw new Error(`Missing reconciliation contract: ${label}`);
            return source.replace(search, replacement);
          }

          // Keep #49's high-density ASCII contracts while removing its stale reference
          // to the already-retired XY landscape file.
          {
            const file = 'scripts/ascii-landscape-audit.mjs';
            let source = fs.readFileSync(file, 'utf8');
            source = replaceRequired(source, "const field = read('src/components/motion/XYSignalField.tsx');\n", '', 'ASCII XY field read');
            source = replaceRequired(source, "requireText(field, 'kind=\"landscape\"', 'XY ASCII landscape renderer');\n", '', 'ASCII XY field requirement');
            source = replaceRequired(source, "const retired = [\n", `const retired = [\n  'src/components/motion/MotionPad.tsx',\n  'src/components/motion/MotionPad.css',\n  'src/components/motion/XYSignalField.tsx',\n  'src/components/motion/UiPolish.css',\n  'src/ui/motion.ts',\n`, 'ASCII retired XY paths');
            source = replaceRequired(
              source,
              "for (const token of ['<video', 'TemporalVideo', 'requestVideoFrameCallback', 'VideoLandscapeEngine', '.mp4']) {\n",
              "for (const token of ['<video', 'TemporalVideo', 'requestVideoFrameCallback', 'VideoLandscapeEngine', '.mp4', 'XYSignalField', 'MotionPad', 'xy-pad', 'knob-patch-jack', 'motion-route']) {\n",
              'ASCII retired runtime tokens',
            );
            fs.writeFileSync(file, source);
          }

          // Turn #49's no-XY source audit into the permanent source+CSS retirement gate.
          {
            const file = 'scripts/no-xy-motion-audit.mjs';
            let source = fs.readFileSync(file, 'utf8');
            source = replaceRequired(
              source,
              "const sourceExtensions = new Set(['.ts', '.tsx', '.js', '.jsx', '.mjs', '.html', '.md']);",
              "const sourceExtensions = new Set(['.ts', '.tsx', '.js', '.jsx', '.mjs', '.html', '.md', '.css']);",
              'no-XY CSS coverage',
            );
            source = replaceRequired(
              source,
              "  'xy-worlds',\n];",
              "  'xy-worlds',\n  'XYSignalField',\n  'MotionPad',\n  'xy-pad',\n  'knob-patch-jack',\n  'knob-modulation-ring',\n  'knob-effective-marker',\n  'motion-route',\n  'route-inspector',\n  'patch-target-active',\n  'hover-axis-',\n];",
              'no-XY retired CSS/source tokens',
            );
            source = replaceRequired(
              source,
              "if (fs.existsSync('src/ui/motion.ts')) failures.push('src/ui/motion.ts must not exist');\n",
              "for (const retiredPath of ['src/components/motion/MotionPad.tsx', 'src/components/motion/MotionPad.css', 'src/components/motion/XYSignalField.tsx', 'src/components/motion/UiPolish.css', 'src/ui/motion.ts']) {\n  if (fs.existsSync(retiredPath)) failures.push(`${retiredPath} must not exist`);\n}\n",
              'no-XY retired path set',
            );
            fs.writeFileSync(file, source);
          }

          // Remove dead selectors from the one stylesheet where the native branch and
          // main's retirement pass overlap. Running over all CSS makes the gate idempotent.
          const retiredSelectorTokens = [
            'xy-',
            'knob-patch-jack',
            'knob-modulation-ring',
            'knob-effective-marker',
            'motion-route',
            'route-inspector',
            'route-axis',
            'route-options',
            'route-depth',
            'route-controls',
            'patch-target-active',
            'hover-axis-',
            'persistent-patch-layer',
            'live-patch-layer',
            'patch-is-dragging',
            'dream-pad',
            'dream-reticle',
            'dream-position-guide',
            'dream-origin',
            'dream-cursor',
            'dream-hud',
          ];

          function walk(root) {
            const files = [];
            if (!fs.existsSync(root)) return files;
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) files.push(...walk(full));
              else if (entry.name.endsWith('.css')) files.push(full);
            }
            return files;
          }

          for (const file of walk('src')) {
            const original = fs.readFileSync(file, 'utf8');
            const root = postcss.parse(original, { from: file });
            root.walkRules((rule) => {
              const selectors = rule.selectors;
              if (!selectors) return;
              const kept = selectors.filter((selector) => {
                const lower = selector.toLowerCase();
                return !retiredSelectorTokens.some((token) => lower.includes(token));
              });
              if (kept.length === selectors.length) return;
              if (kept.length === 0) rule.remove();
              else rule.selectors = kept;
            });
            const next = root.toString();
            if (next !== original) fs.writeFileSync(file, next);
          }
          NODE

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --cached --check

      - name: Validate reconciled tree
        run: npm run check
      - name: Commit reconciled main
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Reconcile native DSP branch with XY retirement and SPICE fixes"
          git push origin HEAD:agent/native-dsp-reconcile
