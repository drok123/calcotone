name: Stomp and Stack ASCII spectacle

on:
  push:
    branches:
      - agent/native-dsp-core
    paths:
      - .github/workflows/rail-spectacle.yml
      - scripts/apply-rail-spectacle.py

permissions:
  contents: write

jobs:
  patch-check-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Stomp and Stack spectacle
        run: python scripts/apply-rail-spectacle.py
      - name: Install dependencies
        run: npm ci
      - name: Run visual and Loop audits
        run: npm run audit:visual && npm run audit:loop
      - name: Run production build
        run: npm run build
      - name: Run full Calcotone diagnostics
        run: npm run check
      - name: Commit validated Rail C renderer
        shell: bash
        run: |
          rm -f .github/workflows/rail-spectacle.yml scripts/apply-rail-spectacle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ascii/RailCHardwareDisplay.tsx scripts/visual-audit.mjs .github/workflows/rail-spectacle.yml scripts/apply-rail-spectacle.py
          git commit -m "Turn Stomp and Stack ASCII into spectacle art"
          git push origin HEAD:agent/native-dsp-core
