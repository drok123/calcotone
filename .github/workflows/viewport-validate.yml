name: Majestic Viewport Validate

on:
  pull_request:
    paths:
      - 'src/components/effects/**'
      - '.github/workflows/viewport-validate.yml'

permissions:
  contents: read

concurrency:
  group: majestic-viewport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
