name: Restore approved faceplate

on:
  push:
    branches: [agent/native-dsp-core]
    paths:
      - .github/workflows/restore-approved-faceplate.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore uploaded approved faceplate contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          layout_path = Path('src/ui/faceplateLayout.ts')
          layout = layout_path.read_text()
          old_revision = "const FACTORY_LAYOUT_REVISION = '2026-08-05-web-ui-1to1-restoration';"
          new_revision = "const FACTORY_LAYOUT_REVISION = '2026-08-06-uploaded-approved-faceplate-1440p-v1';"
          if old_revision not in layout:
              raise SystemExit('expected previous factory revision was not found')
          layout = layout.replace(old_revision, new_revision, 1)

          approved_block = '''const MASTER_KNOBS: FaceplatePoint[] = [
            { x: 0.09523809523809523, y: 224 },
            { x: 0.21428571428571427, y: 224 },
            { x: 0.3333333333333333, y: 224 },
            { x: 0.6785714285714286, y: 224 },
            { x: 0.7976190476190477, y: 224 },
            { x: 0.9166666666666666, y: 224 },
          ];

          function createCoreFactoryLayouts(): Record<CoreFaceplateId, RailCFaceplateModuleLayout> {
            return Object.fromEntries(CORE_FACEPLATE_IDS.map((id) => [id, {
              viewportHeight: 168,
              stageHeight: 304,
              knobs: MASTER_KNOBS.map((point) => ({ ...point })),
              buttons: [],
            }])) as unknown as Record<CoreFaceplateId, RailCFaceplateModuleLayout>;
          }

          export const FACTORY_FACEPLATE_LAYOUT: FaceplateLayout = {
            version: 2,
            custom: true,
            viewportHeight: 168,
            stageHeight: 304,
            knobs: MASTER_KNOBS.map((point) => ({ ...point })),
            core: createCoreFactoryLayouts(),
            railC: {
              stomp: {
                viewportHeight: 168,
                stageHeight: 304,
                knobs: [
                  { x: 0.0935672514619883, y: 224 },
                  { x: 0.21052631578947367, y: 224 },
                  { x: 0.32748538011695905, y: 224 },
                  { x: 0.6549707602339181, y: 224 },
                  { x: 0.7719298245614035, y: 224 },
                  { x: 0.8888888888888888, y: 224 },
                ],
                buttons: [],
              },
              chaos: {
                viewportHeight: 168,
                stageHeight: 304,
                knobs: [
                  { x: 0.3157894736842105, y: 216 },
                  { x: 0.4327485380116959, y: 216 },
                  { x: 0.5497076023391813, y: 216 },
                  { x: 0.6666666666666666, y: 216 },
                ],
                buttons: [],
              },
              pressure: {
                viewportHeight: 168,
                stageHeight: 304,
                knobs: [
                  { x: 0.3391812865497076, y: 216 },
                  { x: 0.4444444444444444, y: 216 },
                  { x: 0.5497076023391813, y: 216 },
                  { x: 0.6549707602339181, y: 216 },
                ],
                buttons: [
                  { x: 0.14, y: 278 },
                  { x: 0.38, y: 278 },
                  { x: 0.62, y: 278 },
                  { x: 0.86, y: 278 },
                ],
              },
            },
            snap: 8,
          };'''

          pattern = re.compile(
              r"const MASTER_KNOBS: FaceplatePoint\[\] = \[[\s\S]*?\n\};\n\nlet state: FaceplateEditorState",
              re.MULTILINE,
          )
          layout, count = pattern.subn(approved_block + '\n\nlet state: FaceplateEditorState', layout, count=1)
          if count != 1:
              raise SystemExit(f'factory block replacement count was {count}')
          layout_path.write_text(layout)

          visual_path = Path('scripts/visual-audit.mjs')
          visual = visual_path.read_text()
          replacements = {
              "'stageHeight: 292'": "'stageHeight: 304'",
              "'{ x: 0.07, y: 246 }'": "'{ x: 0.09523809523809523, y: 224 }'",
              "'{ x: 0.2099125364431487, y: 246 }'": "'{ x: 0.21428571428571427, y: 224 }'",
              "'{ x: 0.3498542274052478, y: 246 }'": "'{ x: 0.3333333333333333, y: 224 }'",
              "'{ x: 0.6530612244897959, y: 246 }'": "'{ x: 0.6785714285714286, y: 224 }'",
              "'{ x: 0.793002915451895, y: 246 }'": "'{ x: 0.7976190476190477, y: 224 }'",
              "'{ x: 0.93, y: 246 }'": "'{ x: 0.9166666666666666, y: 224 }'",
              "const FACTORY_LAYOUT_REVISION = '2026-08-05-web-ui-1to1-restoration'": "const FACTORY_LAYOUT_REVISION = '2026-08-06-uploaded-approved-faceplate-1440p-v1'",
              "requireText(faceplate, '{ x: 0.14, y: 240 }', 'Pressure web-reference knob integration');": "requireText(faceplate, '{ x: 0.3391812865497076, y: 216 }', 'Pressure uploaded-approved knob integration');",
          }
          for old, new in replacements.items():
              if old not in visual:
                  raise SystemExit(f'missing visual audit contract: {old}')
              visual = visual.replace(old, new, 1)

          geometry_pattern = re.compile(
              r"const approvedFaceplateGeometry = \[[\s\S]*?\n\];\nlet faceplateGeometryCursor = faceplate\.indexOf\('[^']+'\);",
              re.MULTILINE,
          )
          geometry_contract = '''const approvedFaceplateGeometry = [
            '{ x: 0.09523809523809523, y: 224 }',
            '{ x: 0.21428571428571427, y: 224 }',
            '{ x: 0.3333333333333333, y: 224 }',
            '{ x: 0.6785714285714286, y: 224 }',
            '{ x: 0.7976190476190477, y: 224 }',
            '{ x: 0.9166666666666666, y: 224 }',
            'version: 2',
            'custom: true',
            'viewportHeight: 168',
            'stageHeight: 304',
            'snap: 8',
          ];
          let faceplateGeometryCursor = faceplate.indexOf('const MASTER_KNOBS');'''
          visual, geometry_count = geometry_pattern.subn(geometry_contract, visual, count=1)
          if geometry_count != 1:
              raise SystemExit(f'visual geometry audit replacement count was {geometry_count}')
          visual_path.write_text(visual)

          parity_path = Path('scripts/web-ui-1to1-audit.mjs')
          parity = parity_path.read_text()
          old_contract = '''require(layout.includes("const FACTORY_LAYOUT_REVISION = '2026-08-05-web-ui-1to1-restoration';"), '1:1 layout migration revision is missing');
          require(layout.includes("pressure: {\\n      viewportHeight: 168,\\n      stageHeight: 292,\\n      knobs: [\\n        { x: 0.14, y: 240 },\\n        { x: 0.38, y: 240 },\\n        { x: 0.62, y: 240 },\\n        { x: 0.86, y: 240 },"), 'Pressure geometry does not match the web reference');
          require(layout.includes('{ x: 0.07, y: 246 }') && layout.includes('{ x: 0.93, y: 246 }'), 'core six-knob geometry drifted');'''
          new_contract = '''require(layout.includes("const FACTORY_LAYOUT_REVISION = '2026-08-06-uploaded-approved-faceplate-1440p-v1';"), 'uploaded approved layout migration revision is missing');
          require(layout.includes("pressure: {\\n      viewportHeight: 168,\\n      stageHeight: 304,\\n      knobs: [\\n        { x: 0.3391812865497076, y: 216 },\\n        { x: 0.4444444444444444, y: 216 },\\n        { x: 0.5497076023391813, y: 216 },\\n        { x: 0.6549707602339181, y: 216 },"), 'Pressure geometry does not match the uploaded approved faceplate');
          require(layout.includes('{ x: 0.09523809523809523, y: 224 }') && layout.includes('{ x: 0.9166666666666666, y: 224 }'), 'uploaded approved core six-knob geometry drifted');'''
          if old_contract not in parity:
              raise SystemExit('web UI parity geometry contract was not found')
          parity = parity.replace(old_contract, new_contract, 1)
          parity = parity.replace(
              "Web UI 1:1 parity audit passed · canonical 76px knobs, text rows, viewport flow, and Pressure geometry are locked for Windows.",
              "Web UI 1:1 parity audit passed · uploaded approved 304px faceplate, canonical 76px knobs, text rows, and 1440p viewport flow are locked for Windows.",
              1,
          )
          parity_path.write_text(parity)
          PY

      - name: Validate approved faceplate with 1440p renderer
        run: |
          npm ci
          npm run audit:visual
          npm run audit:web-ui-1to1
          npm run audit:hd-ui
          npm run audit:windows-ui-parity
          npm run build

      - name: Commit restored faceplate
        run: |
          rm .github/workflows/restore-approved-faceplate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/faceplateLayout.ts scripts/visual-audit.mjs scripts/web-ui-1to1-audit.mjs .github/workflows/restore-approved-faceplate.yml
          git commit -m "Restore uploaded approved faceplate with 1440p rendering"
          git push origin HEAD:agent/native-dsp-core
