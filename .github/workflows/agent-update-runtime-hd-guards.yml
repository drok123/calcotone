name: Update runtime HD guards

on:
  push:
    branches: [agent/native-dsp-core]
    paths:
      - 'scripts/agent-update-runtime-hd-guards.py'
      - '.github/workflows/agent-update-runtime-hd-guards.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0
      - name: Apply adaptive runtime visual guards
        run: python scripts/agent-update-runtime-hd-guards.py
      - name: Commit audit update and remove temporary patch assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update runtime audit for adaptive HD visuals"
          git pull --rebase origin agent/native-dsp-core
          git push origin HEAD:agent/native-dsp-core
