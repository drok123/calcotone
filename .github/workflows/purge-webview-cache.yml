name: Purge WebView Cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-webview-cache.yml

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove generated SDK cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native/packages
          grep -qxF 'native/packages/' .gitignore || printf '\nnative/packages/\n' >> .gitignore
          rm .github/workflows/purge-webview-cache.yml
          test ! -e native/packages

      - name: Commit clean canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated WebView2 SDK cache"
          git push origin HEAD:main
