name: Hardware random sweet spots

on:
  push:
    branches: [hardware-random-sweet-spots]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardware-random-sweet-spots
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply randomizer patch
        run: python scripts/apply_hardware_sweet_spots.py
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        run: npm run build
      - name: Commit verified App source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add hardware sweet spots to musical random"
          git push origin hardware-random-sweet-spots
