name: Materialize top strip random controls

on:
  push:
    branches: [main]
    paths:
      - 'scripts/materialize-top-strip-random-controls.mjs'
      - '.github/workflows/materialize-top-strip-random-controls.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Move controls into top strip
        run: node scripts/materialize-top-strip-random-controls.mjs
      - name: Verify placement
        shell: bash
        run: |
          node scripts/core-contract-parity-audit.mjs
          grep -q 'className="top-random-actions"' src/App.tsx
          if grep -q 'className="rack-random-actions"' src/App.tsx; then exit 1; fi
          if grep -q 'padding-top: 42px' src/App.css; then exit 1; fi
      - name: Commit materialized UI
        shell: bash
        run: |
          git add src/App.tsx src/App.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move random controls into top status strip'
          git push origin HEAD:main
