name: Generated rack mode handoff v2

on:
  push:
    branches: [agent/realtime-crackle-hardening]

permissions:
  contents: write

jobs:
  align-generated-rack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Route generated discrete models through committed rack state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(source, old, new, label, count=1):
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count}, found {actual}')
              return source.replace(old, new, count)

          generator_path = Path('native/tools/apply_atmos_parity.py')
          generator = generator_path.read_text()
          generator = replace_required(
              generator,
              '''    # Params owns the UI-facing atomics, while each parity processor owns its own\n    # sample-rate smoothing. Feed the atomic targets directly. The former wrapper\n    # called Params::glide only once per host block, then smoothed a second time in\n    # the processor; model changes could take seconds and rounded indices appeared\n    # unresponsive at normal callback sizes.\n''',
              '''    # Continuous controls feed the parity processors directly because those engines\n    # own their sample-rate smoothing. Discrete model slot zero is different: NativeRack\n    # commits p.value[0] only at the guaranteed dry crossing, so generated wrappers must\n    # never bypass that handoff by reading p.target[0] directly.\n''',
              'generated rack handoff comment')
          selector = 'p.target[0].load(std::memory_order_relaxed)'
          if generator.count(selector) != 6:
              raise SystemExit(f'expected 6 generated discrete selector reads, found {generator.count(selector)}')
          generator = generator.replace(selector, 'p.value[0]')
          generator_path.write_text(generator)

          ember_route_path = Path('native/tools/apply_ember_magnetic_route.py')
          ember_route = ember_route_path.read_text()
          ember_route = replace_required(
              ember_route,
              '    const float mode_value = p.target[0].load(std::memory_order_relaxed);\n',
              '    const float mode_value = p.value[0];\n',
              'Ember specialty wrapper committed mode')
          ember_route_path.write_text(ember_route)

          test_path = Path('native/tests/native_rack_test.cpp')
          test = test_path.read_text()
          marker = '''  assert(calcotone::rack_module_from_name("saturation") == calcotone::RackModule::Ember);\n'''
          insertion = '''  // Generated parity wrappers must keep the old model active through fade-out.\n  {\n    calcotone::NativeRack reference(kRate);\n    calcotone::NativeRack switched(kRate);\n    for (auto* rack : {&reference, &switched}) {\n      rack->set_bypassed(calcotone::RackModule::Stomp, false);\n      assert(rack->set_parameter(calcotone::RackModule::Stomp, "mode", 0.F));\n      assert(rack->set_parameter(calcotone::RackModule::Stomp, "drive", .82F));\n      assert(rack->set_parameter(calcotone::RackModule::Stomp, "mix", 1.F));\n    }\n    std::vector<float> warmup(4096U * 2U);\n    for (std::size_t frame = 0; frame < 4096U; ++frame) {\n      const float sample = .22F * std::sin(static_cast<float>(frame) * 6.283185307F * 173.F / kRate);\n      warmup[frame * 2U] = sample; warmup[frame * 2U + 1U] = sample;\n    }\n    auto ref_warmup = warmup; auto switched_warmup = warmup;\n    reference.process(ref_warmup.data(), ref_warmup.data(), 4096U);\n    switched.process(switched_warmup.data(), switched_warmup.data(), 4096U);\n    assert(switched.set_parameter(calcotone::RackModule::Stomp, "mode", 13.F));\n    std::vector<float> reference_audio(512U * 2U), switched_audio(512U * 2U);\n    for (std::size_t frame = 0; frame < 512U; ++frame) {\n      const float sample = .22F * std::sin(static_cast<float>(frame + 4096U) * 6.283185307F * 173.F / kRate);\n      reference_audio[frame * 2U] = sample; reference_audio[frame * 2U + 1U] = sample;\n      switched_audio[frame * 2U] = sample; switched_audio[frame * 2U + 1U] = sample;\n    }\n    const auto dry = switched_audio;\n    reference.process(reference_audio.data(), reference_audio.data(), 512U);\n    switched.process(switched_audio.data(), switched_audio.data(), 512U);\n    constexpr float first_mode_mix = 1.F - 1.F / 144.F;\n    for (unsigned channel = 0; channel < 2U; ++channel) {\n      const float expected = dry[channel] + (reference_audio[channel] - dry[channel]) * first_mode_mix;\n      assert(std::abs(switched_audio[channel] - expected) < 2e-4F);\n    }\n  }\n\n'''
          if test.count(marker) != 1:
              raise SystemExit('missing generated handoff test insertion point')
          test = test.replace(marker, insertion + marker, 1)
          test_path.write_text(test)

          audit_path = Path('scripts/native-realtime-safety-audit.mjs')
          audit = audit_path.read_text()
          audit = replace_required(
              audit,
              "const host = read('native/src/wasapi_host.cpp');\n",
              "const host = read('native/src/wasapi_host.cpp');\nconst parityGenerator = read('native/tools/apply_atmos_parity.py');\nconst emberRouteGenerator = read('native/tools/apply_ember_magnetic_route.py');\n",
              'generator realtime audit sources')
          anchor = '''for (const token of [\n  'RealtimeThreadScope realtime;',\n'''
          checks = '''requireText(parityGenerator, 'p.value[0]', 'Generated parity wrapper committed model state');\nforbidText(parityGenerator, 'p.target[0].load(std::memory_order_relaxed)', 'Generated parity wrapper target-mode bypass');\nrequireText(emberRouteGenerator, 'const float mode_value = p.value[0];', 'Generated Ember specialty committed mode state');\nforbidText(emberRouteGenerator, 'const float mode_value = p.target[0]', 'Generated Ember specialty target-mode bypass');\n\n'''
          if audit.count(anchor) != 1:
              raise SystemExit('missing realtime generator audit insertion point')
          audit = audit.replace(anchor, checks + anchor, 1)
          audit_path.write_text(audit)
          PY

          git rm .github/workflows/generated-mode-handoff-v2.yml
          git add native/tools/apply_atmos_parity.py native/tools/apply_ember_magnetic_route.py native/tests/native_rack_test.cpp scripts/native-realtime-safety-audit.mjs
          git diff --cached --check

      - name: Validate generated native rack behavior
        run: npm run check
      - name: Commit generated handoff fix
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Honor dry-cross model state in generated native rack"
          git push origin HEAD:agent/realtime-crackle-hardening
