name: Hardware calibration pass 1

on:
  push:
    branches: [hardware-calibration-pass1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardware-calibration-pass1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply calibration patch
        run: python scripts/hardware_calibration_pass1.py
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        id: build
        continue-on-error: true
        run: npm run build > hardware-calibration-build.log 2>&1
      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hardware-calibration-build-log
          path: hardware-calibration-build.log
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          cat hardware-calibration-build.log
          exit 1
      - name: Commit passing calibration
        if: steps.build.outcome == 'success'
        run: |
          rm scripts/hardware_calibration_pass1.py
          rm .github/workflows/hardware-calibration-pass1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Calibrate vintage hardware modes against original behavior"
          git push origin hardware-calibration-pass1
