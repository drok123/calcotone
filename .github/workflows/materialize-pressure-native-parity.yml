name: Materialize Pressure Native Parity

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize-pressure-native-parity.py
      - .github/workflows/materialize-pressure-native-parity.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize Pressure parity
        run: python3 scripts/materialize-pressure-native-parity.py

      - name: Audit Stack and full rack routes
        shell: bash
        run: |
          set +e
          npm run audit:stack > stack-audit.log 2>&1
          stack_status=$?
          node scripts/core-contract-parity-audit.mjs > core-audit.log 2>&1
          core_status=$?
          node scripts/windows-ui-parity-audit.mjs > windows-audit.log 2>&1
          windows_status=$?
          {
            echo "stack=$stack_status"
            cat stack-audit.log
            echo
            echo "core=$core_status"
            cat core-audit.log
            echo
            echo "windows=$windows_status"
            cat windows-audit.log
          } > pressure-parity-diagnostics.txt
          if [ "$stack_status" -ne 0 ] || [ "$core_status" -ne 0 ] || [ "$windows_status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pressure-parity-diagnostics.txt
            git commit -m "Record Pressure parity audit diagnostics"
            git push origin HEAD:main
            exit 1
          fi
          rm pressure-parity-diagnostics.txt stack-audit.log core-audit.log windows-audit.log

      - name: Configure native DSP
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build native DSP
        run: cmake --build native/build --config Release --parallel 2

      - name: Run native tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Remove one-time materializer
        run: rm scripts/materialize-pressure-native-parity.py .github/workflows/materialize-pressure-native-parity.yml pressure-parity-diagnostics.txt 2>/dev/null || true

      - name: Commit canonical Pressure parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace embedded Pressure with the canonical dynamics station"
          git push origin HEAD:main
