name: Loop spectacle ring

on:
  push:
    branches:
      - agent/native-dsp-core
    paths:
      - .github/workflows/loop-spectacle-ring.yml
      - scripts/apply-loop-spectacle-ring.py

permissions:
  contents: write

jobs:
  patch-check-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Loop spectacle ring
        run: python scripts/apply-loop-spectacle-ring.py
      - name: Install dependencies
        run: npm ci
      - name: Run Loop and visual audits
        run: npm run audit:loop && npm run audit:visual && npm run audit:runtime
      - name: Run production build
        run: npm run build
      - name: Run full Calcotone diagnostics
        run: npm run check
      - name: Commit validated Loop spectacle
        shell: bash
        run: |
          rm -f .github/workflows/loop-spectacle-ring.yml scripts/apply-loop-spectacle-ring.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ascii/RailCHardwareDisplay.tsx scripts/loop-audit.mjs .github/workflows/loop-spectacle-ring.yml scripts/apply-loop-spectacle-ring.py
          git commit -m "Give Loop a defined spectacle clock"
          git push origin HEAD:agent/native-dsp-core
