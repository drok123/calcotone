name: Faceplate resize anchor fix

on:
  push:
    branches: [faceplate-resize-anchor-fix]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faceplate-resize-anchor-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply resize-anchor fix
        run: python scripts/fix_faceplate_resize_anchor.py
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        run: npm run build
      - name: Commit verified source only
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/faceplateLayout.ts src/components/effects/EffectModule.tsx src/components/motion/UiPolish.css
          git commit -m "Decouple screen resizing from faceplate controls"
          git push origin faceplate-resize-anchor-fix
