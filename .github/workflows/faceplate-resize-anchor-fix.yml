name: Faceplate resize anchor fix

on:
  push:
    branches: [faceplate-resize-anchor-fix]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faceplate-resize-anchor-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Build CALCOTONE
        run: npm run build
