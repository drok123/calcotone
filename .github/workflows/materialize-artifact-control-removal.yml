name: Materialize Artifact Control Removal

on:
  push:
    branches: [main]
    paths:
      - scripts/remove-artifact-matrix-controls.mjs
      - scripts/remove-artifact-matrix-leftovers.mjs
      - .github/workflows/materialize-artifact-control-removal.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove ghost controls
        run: |
          node scripts/remove-artifact-matrix-controls.mjs
          node scripts/remove-artifact-matrix-leftovers.mjs

      - name: Verify stale control plumbing is gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E "chainOrder|ARTIFACT_MATRIX_PARAMETER_IDS|isArtifactMatrixParameter|ArtifactChainProcessor|artifact_chain_" -- src native; then
            echo "Stale Artifact matrix plumbing remains in product source."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run full diagnostics
        run: npm run check

      - name: Remove one-time materializer
        run: rm scripts/remove-artifact-matrix-controls.mjs scripts/remove-artifact-matrix-leftovers.mjs .github/workflows/materialize-artifact-control-removal.yml

      - name: Commit canonical cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
            exit 0
          fi
          git commit -m "Remove Artifact console tube and chain-order controls"
          git push origin HEAD:main
