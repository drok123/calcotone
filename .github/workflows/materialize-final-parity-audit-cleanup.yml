name: Materialize Final Parity Audit Cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize-final-parity-audit-cleanup.py
      - scripts/fix-final-stack-default-audit.py
      - scripts/fix-portable-native-test-driver.py
      - .github/workflows/materialize-final-parity-audit-cleanup.yml

concurrency:
  group: materialize-final-parity-audit-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize final parity cleanup
        run: |
          python scripts/materialize-final-parity-audit-cleanup.py
          python scripts/fix-final-stack-default-audit.py
          python scripts/fix-portable-native-test-driver.py
          rm -f scripts/materialize-top-strip-random-controls.mjs
          rm -f .github/workflows/materialize-top-strip-random-controls.yml

      - name: Run complete diagnostics and production build
        run: npm run check

      - name: Verify retired UI cannot return
        run: |
          ! grep -qE '\.module-synth|\.synth-|\.piano-roll-' src/components/effects/RailCModules.css
          ! grep -q '16-step piano roll' src/components/effects/RailCModules.tsx
          ! grep -q '<MotionPad' src/components/effects/RailCModules.tsx
          grep -q 'stack-amp-readout' src/components/effects/RailCModules.tsx
          grep -q "2026-08-05-approved-compact-native-1to1" src/ui/faceplateLayout.ts
          grep -q "defaultValue: 5" scripts/stack-amp-audit.mjs
          grep -q "model: 'calcotone' as StackAmpModel" scripts/stack-amp-audit.mjs
          grep -q 'ctest --test-dir' native/Makefile

      - name: Remove one-time cleanup machinery
        run: |
          rm scripts/materialize-final-parity-audit-cleanup.py
          rm scripts/fix-final-stack-default-audit.py
          rm scripts/fix-portable-native-test-driver.py
          rm .github/workflows/materialize-final-parity-audit-cleanup.yml

      - name: Commit clean canonical audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align final audits with definitive Windows rack"
          git push origin HEAD:main
