name: Drift transition hardening

on:
  push:
    branches: [agent/realtime-crackle-hardening]

permissions:
  contents: write

jobs:
  harden-drift:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add Drift dry-crossed discrete handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(source, old, new, label, count=1):
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count}, found {actual}')
              return source.replace(old, new, count)

          path = Path('native/src/drift_parity_processor.cpp')
          source = path.read_text()
          source = replace_required(
              source,
              '''  std::size_t active_mode{std::numeric_limits<std::size_t>::max()};\n  const DriftParityProfile* active_profile{&kDriftParityProfiles[0]};\n  float dry_gain{1.F};\n  float wet_gain{};\n''',
              '''  std::size_t active_mode{std::numeric_limits<std::size_t>::max()};\n  std::size_t pending_mode{};\n  const DriftParityProfile* active_profile{&kDriftParityProfiles[0]};\n  float dry_gain{1.F};\n  float wet_gain{};\n  float mode_mix{1.F};\n  float mode_fade_step{};\n  unsigned mode_transition{};\n''',
              'Drift transition state')
          source = replace_required(
              source,
              '''    glide_amount = 1.F - std::exp(-1.F / (sample_rate * .035F));\n''',
              '''    glide_amount = 1.F - std::exp(-1.F / (sample_rate * .035F));\n    mode_fade_step = 1.F / std::max(1.F, sample_rate * .003F);\n''',
              'Drift transition coefficient')
          source = replace_required(
              source,
              '''    active_mode = std::numeric_limits<std::size_t>::max();\n    control_countdown = 0U;\n''',
              '''    active_mode = std::numeric_limits<std::size_t>::max();\n    pending_mode = 0U;\n    mode_mix = 1.F;\n    mode_transition = 0U;\n    control_countdown = 0U;\n''',
              'Drift reset transition state')
          source = replace_required(
              source,
              '''  void refresh_routing_and_mix() noexcept {\n    const auto mode = std::min<std::size_t>(21, static_cast<std::size_t>(std::lround(value[0])));\n    if (mode != active_mode) {\n      active_mode = mode;\n      active_profile = &drift_parity_profile(mode);\n      if (active_profile->branch == DriftParityBranch::Classic) {\n        classic.set_model(active_profile->classic_model);\n      } else {\n        classic.set_model(0);\n        standard.set_mode(static_cast<unsigned>(mode));\n      }\n    }\n    const float mix = clamp01(value[6]);\n    dry_gain = std::cos(mix * kPi * .5F);\n    wet_gain = std::sin(mix * kPi * .5F);\n  }\n''',
              '''  void activate_mode(std::size_t mode) noexcept {\n    mode = std::min<std::size_t>(21, mode);\n    active_mode = mode;\n    active_profile = &drift_parity_profile(mode);\n    if (active_profile->branch == DriftParityBranch::Classic) {\n      classic.set_model(active_profile->classic_model);\n    } else {\n      classic.set_model(0);\n      standard.set_mode(static_cast<unsigned>(mode));\n    }\n  }\n\n  void refresh_routing_and_mix() noexcept {\n    const auto requested = std::min<std::size_t>(21, static_cast<std::size_t>(std::lround(value[0])));\n    if (active_mode == std::numeric_limits<std::size_t>::max()) {\n      activate_mode(requested);\n      pending_mode = requested;\n      mode_mix = 1.F;\n      mode_transition = 0U;\n    } else if (requested != active_mode) {\n      pending_mode = requested;\n      if (mode_transition == 0U || mode_transition == 2U) mode_transition = 1U;\n    }\n    const float mix = clamp01(value[6]);\n    dry_gain = std::cos(mix * kPi * .5F);\n    wet_gain = std::sin(mix * kPi * .5F);\n  }\n\n  void advance_mode_transition() noexcept {\n    if (mode_transition == 1U) {\n      mode_mix = std::max(0.F, mode_mix - mode_fade_step);\n      if (mode_mix <= 0.F) {\n        mode_mix = 0.F;\n        activate_mode(pending_mode);\n        mode_transition = 2U;\n      }\n    } else if (mode_transition == 2U) {\n      mode_mix = std::min(1.F, mode_mix + mode_fade_step);\n      if (mode_mix >= 1.F) {\n        mode_mix = 1.F;\n        mode_transition = 0U;\n      }\n    }\n  }\n''',
              'Drift mode switch implementation')
          source = replace_required(
              source,
              '''      glide();\n      if (refresh_control) refresh_routing_and_mix();\n\n      const float rate = std::clamp(value[1], .05F, 2.5F);\n''',
              '''      glide();\n      if (refresh_control) refresh_routing_and_mix();\n      advance_mode_transition();\n\n      const float rate = std::clamp(value[1], .05F, 2.5F);\n''',
              'Drift transition advancement')
          source = replace_required(
              source,
              '''      data[frame * 2] = std::clamp(dry_l * dry_gain + wet[0] * wet_gain, -1.2F, 1.2F);\n      data[frame * 2 + 1] = std::clamp(dry_r * dry_gain + wet[1] * wet_gain, -1.2F, 1.2F);\n''',
              '''      const float processed_l = std::clamp(dry_l * dry_gain + wet[0] * wet_gain, -1.2F, 1.2F);\n      const float processed_r = std::clamp(dry_r * dry_gain + wet[1] * wet_gain, -1.2F, 1.2F);\n      data[frame * 2] = dry_l + (processed_l - dry_l) * mode_mix;\n      data[frame * 2 + 1] = dry_r + (processed_r - dry_r) * mode_mix;\n''',
              'Drift dry-cross output')
          path.write_text(source)

          test_path = Path('native/tests/drift_parity_processor_test.cpp')
          test = test_path.read_text()
          marker = '''  std::size_t distinct = 0;\n'''
          insertion = '''  // Live mode changes are dry-crossed before a classic/standard topology reset.\n  // This locks out the single-sample state reset that previously produced clicks.\n  {\n    calcotone::DriftParityProcessor processor(48'000.F);\n    processor.set_parameter("mode", 1.F);\n    processor.set_parameter("rate", .83F);\n    processor.set_parameter("depth", .0051F);\n    processor.set_parameter("shape", .61F);\n    processor.set_parameter("spread", .79F);\n    processor.set_parameter("motion", .66F);\n    processor.set_parameter("mix", 1.F);\n    std::array<float, 4096U * 2U> warmup{};\n    for (std::size_t frame = 0; frame < 4096U; ++frame) {\n      const float sample = .22F * std::sin(static_cast<float>(frame) * 6.283185307F * 173.F / 48'000.F);\n      warmup[frame * 2U] = sample;\n      warmup[frame * 2U + 1U] = sample;\n    }\n    processor.process(warmup.data(), 4096U);\n    processor.set_parameter("mode", 21.F);\n    std::array<float, 512U * 2U> changing{};\n    for (std::size_t frame = 0; frame < 512U; ++frame) {\n      const float sample = .22F * std::sin(static_cast<float>(frame + 4096U) * 6.283185307F * 173.F / 48'000.F);\n      changing[frame * 2U] = sample;\n      changing[frame * 2U + 1U] = sample;\n    }\n    const auto dry = changing;\n    processor.process(changing.data(), 512U);\n    constexpr std::size_t crossing = 143U;\n    assert(std::abs(changing[crossing * 2U] - dry[crossing * 2U]) < 1e-5F);\n    assert(std::abs(changing[crossing * 2U + 1U] - dry[crossing * 2U + 1U]) < 1e-5F);\n  }\n\n'''
          if test.count(marker) != 1:
              raise SystemExit('missing Drift test insertion point')
          test = test.replace(marker, insertion + marker, 1)
          test_path.write_text(test)

          audit_path = Path('scripts/native-realtime-safety-audit.mjs')
          audit = audit_path.read_text()
          audit = replace_required(
              audit,
              "const atmos = read('native/src/atmos_parity_processor.cpp');\n",
              "const atmos = read('native/src/atmos_parity_processor.cpp');\nconst drift = read('native/src/drift_parity_processor.cpp');\n",
              'Drift realtime audit source')
          audit = replace_required(
              audit,
              '''forbidText(atmos, 'std::make_unique<AtmosNetwork>', 'Atmos audio callback heap allocation');\n\n''',
              '''forbidText(atmos, 'std::make_unique<AtmosNetwork>', 'Atmos audio callback heap allocation');\n\nfor (const token of [\n  'float mode_mix{1.F};',\n  'float mode_fade_step{};',\n  'unsigned mode_transition{};',\n  'void activate_mode(std::size_t mode) noexcept',\n  'void advance_mode_transition() noexcept',\n  'data[frame * 2] = dry_l + (processed_l - dry_l) * mode_mix;',\n]) requireText(drift, token, 'Click-safe dedicated Drift model handoff');\n\n''',
              'Drift realtime audit contracts')
          audit = audit.replace(
              'Native realtime safety audit passed · discrete model changes are dry-crossed and Atmos switching performs no network heap allocation in the render callback',
              'Native realtime safety audit passed · rack and Drift model changes are dry-crossed and Atmos switching performs no network heap allocation in the render callback')
          audit_path.write_text(audit)
          PY

          git rm .github/workflows/drift-transition-hardening.yml
          git add native/src/drift_parity_processor.cpp native/tests/drift_parity_processor_test.cpp scripts/native-realtime-safety-audit.mjs
          git diff --cached --check

      - name: Validate complete Calcotone tree
        run: npm run check
      - name: Commit Drift transition hardening
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Dry-cross dedicated Drift model changes"
          git push origin HEAD:agent/realtime-crackle-hardening
