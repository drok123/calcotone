name: High-fidelity module ASCII

on:
  push:
    branches:
      - agent/native-dsp-core
    paths:
      - .github/workflows/ascii-spectacle.yml
      - scripts/apply-ascii-spectacle.py

permissions:
  contents: write

jobs:
  patch-check-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply spectacle renderer
        run: python scripts/apply-ascii-spectacle.py
      - name: Install dependencies
        run: npm ci
      - name: Run visual audits
        run: npm run audit:visual && npm run audit:ascii-world
      - name: Run production build
        run: npm run build
      - name: Run full Calcotone diagnostics
        run: npm run check
      - name: Commit validated renderer
        shell: bash
        run: |
          rm -f .github/workflows/ascii-spectacle.yml scripts/apply-ascii-spectacle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ascii/AsciiArtEngine.tsx src/components/effects/ModuleViewport.tsx scripts/visual-audit.mjs scripts/ascii-landscape-audit.mjs .github/workflows/ascii-spectacle.yml scripts/apply-ascii-spectacle.py
          git commit -m "Upgrade module ASCII to spectacle fidelity"
          git push origin HEAD:agent/native-dsp-core
