name: Calcotone Functionality Guard

on:
  pull_request:
  workflow_dispatch:

jobs:
  functionality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify XY architecture is absent
        run: node scripts/no-xy-motion-audit.mjs

      - name: Verify native I/O controls
        run: node scripts/native-io-functionality-audit.mjs

      - name: Verify Architect editor wiring
        run: node scripts/architect-functionality-audit.mjs

      - name: Typecheck and build faceplate
        run: npm run build
