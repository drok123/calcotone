name: Native Windows Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/native-windows.yml'

jobs:
  build-wasapi-host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build native faceplate
        run: npm ci && npm run build
      - name: Restore WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.4129.50 -OutputDirectory native/packages -NonInteractive
      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64
      - name: Build native engine
        run: cmake --build native/build --config Release --parallel
      - name: Run portable DSP test
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Add double-click launcher
        run: |
          Copy-Item native/START-CALCOTONE-NATIVE.bat native/build/Release/START-CALCOTONE-NATIVE.bat
          Copy-Item native/CALCOTONE-AUDIO-CONFIG.bat native/build/Release/CALCOTONE-AUDIO-CONFIG.bat
          Copy-Item native/LIST-CALCOTONE-DEVICES.bat native/build/Release/LIST-CALCOTONE-DEVICES.bat
          Copy-Item dist native/build/Release/web -Recurse
      - name: Upload WASAPI host
        uses: actions/upload-artifact@v4
        with:
          name: calcotone-native-windows
          path: |
            native/build/Release/calcotone_host.exe
            native/build/Release/START-CALCOTONE-NATIVE.bat
            native/build/Release/CALCOTONE-AUDIO-CONFIG.bat
            native/build/Release/LIST-CALCOTONE-DEVICES.bat
            native/build/Release/web/**
          if-no-files-found: error
