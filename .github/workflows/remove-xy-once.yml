name: Remove obsolete XY system

on:
  push:
    branches: [remove-xy-dead-code]

permissions:
  contents: write

jobs:
  remove-xy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: remove-xy-dead-code

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Remove XY source and compatibility plumbing
        run: node scripts/remove-xy-dead-code.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate production build
        run: npm run build

      - name: Validate lint
        run: npm run lint

      - name: Validate knob contracts
        run: npm run audit:knobs

      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete XY system"
          git push origin HEAD:remove-xy-dead-code
