name: Validate clean XY removal

on:
  push:
    branches: [remove-xy-clean]

permissions:
  contents: write

jobs:
  clean-xy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: remove-xy-clean

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove retired XY selectors and verify source
        run: node scripts/clean-xy-css.mjs

      - name: Validate production build
        run: npm run build

      - name: Validate lint
        run: npm run lint

      - name: Validate knob contracts
        run: npm run audit:knobs

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No CSS cleanup changes were needed."
          else
            git commit -m "Remove retired XY styles"
            git push origin HEAD:remove-xy-clean
          fi
