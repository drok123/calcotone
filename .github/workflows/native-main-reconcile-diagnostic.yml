name: Native main reconciliation diagnostic

on:
  push:
    branches: [agent/native-dsp-reconcile]

permissions:
  contents: read

jobs:
  conflict-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Dry-run merge current main
        shell: bash
        run: |
          set -u
          git fetch origin main
          git config user.name "calcotone-reconcile"
          git config user.email "reconcile@invalid.local"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          echo "MERGE_STATUS=$merge_status"
          echo "CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICTS_END"
          git status --short
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi
          exit 0
