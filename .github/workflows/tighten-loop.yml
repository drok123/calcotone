name: Tighten Loop usability

on:
  push:
    branches: [agent/native-dsp-core]
    paths:
      - scripts/tighten-loop.py
      - scripts/fix-tighten-loop.py
      - .github/workflows/tighten-loop.yml

permissions:
  contents: write

jobs:
  land-validated-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-dsp-core
          fetch-depth: 0

      - name: Harden patch anchors
        run: python scripts/fix-tighten-loop.py

      - name: Apply already-validated Loop patch
        run: python scripts/tighten-loop.py

      - name: Commit finished Loop pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/tighten-loop.py scripts/fix-tighten-loop.py .github/workflows/tighten-loop.yml
          git add -A
          git diff --cached --quiet || git commit -m "Tighten Loop track lengths and trim editor"
          git push origin HEAD:agent/native-dsp-core
