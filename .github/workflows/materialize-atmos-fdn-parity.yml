name: Materialize Atmos FDN Parity

# Indexed workflow trigger.
on:
  push:
    branches: [main]
    paths:
      - scripts/materialize-atmos-fdn-parity.py
      - .github/workflows/materialize-atmos-fdn-parity.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize Atmos parity
        run: python3 scripts/materialize-atmos-fdn-parity.py

      - name: Configure native DSP
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release

      - name: Build native DSP
        run: cmake --build native/build --config Release --parallel 2

      - name: Run native tests
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Remove one-time materializer
        run: rm scripts/materialize-atmos-fdn-parity.py .github/workflows/materialize-atmos-fdn-parity.yml

      - name: Commit canonical Atmos parity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Atmos around the canonical early late FDN"
          git push origin HEAD:main
