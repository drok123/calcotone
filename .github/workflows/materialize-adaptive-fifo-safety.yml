name: Materialize Adaptive FIFO Safety

on:
  push:
    branches: [main]
    paths:
      - scripts/materialize-adaptive-fifo-safety.py
      - .github/workflows/materialize-adaptive-fifo-safety.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out canonical source
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Materialize adaptive FIFO policy
        run: python scripts/materialize-adaptive-fifo-safety.py

      - name: Audit adaptive transport
        shell: pwsh
        run: |
          npm run audit:core-contract
          npm run audit:windows-ui-parity
          npm run audit:latency
          Select-String -Path native/src/wasapi_host.cpp -Pattern 'fifo_safety.observe_block' -Quiet | ForEach-Object { if (-not $_) { throw 'Adaptive block observation missing.' } }
          Select-String -Path native/src/wasapi_host.cpp -Pattern 'fifo_safety.observe_deadline_miss' -Quiet | ForEach-Object { if (-not $_) { throw 'Deadline adaptation missing.' } }
          Select-String -Path native/src/wasapi_host.cpp -Pattern 'fifoMaximumTargetFrames' -Quiet | ForEach-Object { if (-not $_) { throw 'Adaptive telemetry missing.' } }
          Select-String -Path native/src/elastic_stereo_fifo.cpp -Pattern 'published_target_frames_' -Quiet | ForEach-Object { if (-not $_) { throw 'Published FIFO target missing.' } }

      - name: Preserve canonical host source
        shell: pwsh
        run: |
          Copy-Item native/src/wasapi_host.cpp native/src/wasapi_host.canonical.cpp
          Copy-Item native/src/control_server.cpp native/src/control_server.canonical.cpp

      - name: Generate release-equivalent spectrum host
        shell: pwsh
        run: |
          python native/tools/apply_native_host_visual_parity.py native/src/wasapi_host.cpp native/src/wasapi_host.parity.cpp
          Move-Item -Force native/src/wasapi_host.parity.cpp native/src/wasapi_host.cpp
          python native/tools/apply_control_server_spectrum.py native/src/control_server.cpp native/src/control_server.parity.cpp
          Move-Item -Force native/src/control_server.parity.cpp native/src/control_server.cpp

      - name: Restore WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory native/packages -NonInteractive
          $package = Get-ChildItem native/packages -Directory -Filter 'Microsoft.Web.WebView2.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'WebView2 NuGet package was not restored.' }
          "CALCOTONE_WEBVIEW2_ROOT=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure native host
        run: >-
          cmake -S native -B native/build -A x64
          -DCALCOTONE_WEBVIEW2_ROOT="${{ env.CALCOTONE_WEBVIEW2_ROOT }}"

      - name: Build native host
        run: cmake --build native/build --config Release --parallel

      - name: Run complete native suite
        run: ctest --test-dir native/build -C Release --output-on-failure

      - name: Restore canonical checked-in host
        shell: pwsh
        run: |
          Move-Item -Force native/src/wasapi_host.canonical.cpp native/src/wasapi_host.cpp
          Move-Item -Force native/src/control_server.canonical.cpp native/src/control_server.cpp
          Remove-Item -Recurse -Force native/packages -ErrorAction SilentlyContinue

      - name: Remove one-time materializer
        shell: pwsh
        run: |
          Remove-Item scripts/materialize-adaptive-fifo-safety.py
          Remove-Item .github/workflows/materialize-adaptive-fifo-safety.yml

      - name: Commit canonical adaptive FIFO
        shell: bash
        run: |
          set -euo pipefail
          test ! -e native/packages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adapt FIFO safety depth after realtime faults"
          git push origin HEAD:main
